name: pilas
description: "Pilas: juegos didácticos gratuitos, sin anuncios y sin cuenta, para niños de 3 a 11 años."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  collection: ^1.18.0
  flutter_svg: ^2.0.10
  flutter_tts: ^4.0.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  pdf: ^3.11.0
  printing: ^5.13.0
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/emoji/
    - assets/sounds/
    - assets/coloring/
    - assets/icon/
  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lexend-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lexend-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lexend-Bold.ttf
          weight: 700
    - family: Andika
      fonts:
        - asset: assets/fonts/Andika-Regular.ttf
          weight: 400
        - asset: assets/fonts/Andika-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon-1024.png"
  adaptive_icon_background: "#FFD166"
  adaptive_icon_foreground: "assets/icon/icon-foreground-1024.png"
