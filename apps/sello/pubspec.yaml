name: sello
description: "Sello: cámara de campo con sello de GPS, hora, rumbo, altitud y dirección, gratis y sin anuncios."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  camera: ^0.11.0
  geolocator: ^14.0.0
  geocoding: ^4.0.0
  sensors_plus: ^6.0.0
  image: ^4.5.0
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  gal: ^2.3.0
  archive: ^4.0.0
  pdf: ^3.11.0
  share_plus: ^11.0.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  file_selector: ^1.0.3
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/geoid/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon-1024.png"
  adaptive_icon_background: "#1B4332"
  adaptive_icon_foreground: "assets/icon/icon-foreground-1024.png"
