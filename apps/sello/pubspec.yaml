name: sello
description: "Sello: cámara de campo con sello de GPS, hora, rumbo, altitud y dirección, gratis y sin anuncios."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  camera: ^0.11.0
  geolocator: ^14.0.0
  geocoding: ^4.0.0
  sensors_plus: ^6.0.0
  image: ^4.5.0
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  gal: ^2.3.0
  archive: ^4.0.0
  clock: ^1.1.1
  pdf: ^3.11.0
  share_plus: ^11.0.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  file_selector: ^1.0.3
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/legal/
    - assets/icon/
    - assets/geoid/
  # Tipografía del sello: la misma en Android y en iOS para que la foto sellada
  # se vea igual en cualquier teléfono (Roboto, SIL OFL 1.1).
  fonts:
    - family: SelloSans
      fonts:
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-ExtraBold.ttf
          weight: 800
    # Respaldo para flechas y marcas que Roboto no trae (tools/gen_symbols_font.py).
    - family: Simbolos
      fonts:
        - asset: assets/fonts/Simbolos-Regular.ttf
        - asset: assets/fonts/Simbolos-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon-1024.png"
  adaptive_icon_background: "#1B4332"
  adaptive_icon_foreground: "assets/icon/icon-foreground-1024.png"
