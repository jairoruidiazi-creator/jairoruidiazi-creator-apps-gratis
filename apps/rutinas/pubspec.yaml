name: rutinas
description: "Rutinas: hábitos con racha, recordatorios que insisten y temporizador de intervalos, gratis, sin anuncios y sin cuenta."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  clock: ^1.1.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.0
  flutter_tts: ^4.0.2
  audioplayers: ^6.1.0
  wakelock_plus: ^1.2.8
  share_plus: ^13.0.0
  file_selector: ^1.0.3
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/legal/
    - assets/icon/
    - assets/sounds/
  # Respaldo para flechas y marcas que Roboto no trae (subconjunto de DejaVu
  # Sans generado con tools/gen_symbols_font.py).
  fonts:
    - family: Simbolos
      fonts:
        - asset: assets/fonts/Simbolos-Regular.ttf
        - asset: assets/fonts/Simbolos-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon-1024.png"
  adaptive_icon_background: "#2B2C78"
  adaptive_icon_foreground: "assets/icon/icon-foreground-1024.png"
