name: clave
description: "Clave: afinador, metrónomo, bordón, grabadora y registro de práctica, gratis y sin anuncios."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_soloud: ^5.2.0
  record: ^7.1.2
  audioplayers: ^6.1.0
  flutter_tts: ^4.0.2
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  share_plus: ^11.0.0
  file_selector: ^1.0.3
  clock: ^1.1.1
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/legal/
    - assets/icon/
  # Respaldo para ♩ ♪ ♭ ♮ ♯: Roboto y San Francisco no los traen y cada
  # teléfono los tomaba de una fuente distinta (subconjunto de DejaVu Sans).
  fonts:
    - family: ClaveSymbols
      fonts:
        - asset: assets/fonts/ClaveSymbols-Regular.ttf
        - asset: assets/fonts/ClaveSymbols-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon-1024.png"
  adaptive_icon_background: "#14213D"
  adaptive_icon_foreground: "assets/icon/icon-foreground-1024.png"
