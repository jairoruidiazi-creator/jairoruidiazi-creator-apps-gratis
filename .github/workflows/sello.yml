name: Sello

on:
  push:
    branches: [main]
    paths:
      - "apps/sello/**"
      - ".github/workflows/sello.yml"
      - ".github/workflows/app-ci.yml"
      - "tools/ci/**"
      - "tools/store/**"
  pull_request:
    paths:
      - "apps/sello/**"
      - ".github/workflows/sello.yml"
      - ".github/workflows/app-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sello-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/app-ci.yml
    with:
      app: sello
