name: Clave

on:
  push:
    branches: [main]
    paths:
      - "apps/clave/**"
      - ".github/workflows/clave.yml"
      - "tools/ci/**"
  pull_request:
    paths:
      - "apps/clave/**"
      - ".github/workflows/clave.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clave-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analizar y probar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/clave
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version 2>&1 | tee version.log
      - run: flutter pub get 2>&1 | tee pubget.log; exit ${PIPESTATUS[0]}
      # Los avisos de estilo (info) se revisan en el registro; errores y warnings sí bloquean.
      - run: flutter analyze --no-fatal-infos 2>&1 | tee analyze.log; exit ${PIPESTATUS[0]}
      - run: flutter test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: Publicar registros
        if: always()
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/ci/publish_logs.sh ci-logs-clave-check apps/clave/version.log apps/clave/pubget.log apps/clave/analyze.log apps/clave/test.log

  android:
    name: APK Android
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/clave
    steps:
      - uses: actions/checkout@v4
      - id: plat
        run: |
          if [ -d android ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "La carpeta android/ no existe todavía; falta el bootstrap."; fi
      - uses: actions/setup-java@v4
        if: steps.plat.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        if: steps.plat.outputs.exists == 'true'
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        if: steps.plat.outputs.exists == 'true'
      - run: flutter build apk --release 2>&1 | tee build-android.log; exit ${PIPESTATUS[0]}
        if: steps.plat.outputs.exists == 'true'
      - uses: actions/upload-artifact@v4
        if: steps.plat.outputs.exists == 'true'
        with:
          name: clave-android-apk
          path: apps/clave/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Publicar registros
        if: always() && steps.plat.outputs.exists == 'true'
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/ci/publish_logs.sh ci-logs-clave-android apps/clave/build-android.log

  ios:
    name: iOS sin firma
    needs: check
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/clave
    steps:
      - uses: actions/checkout@v4
      - id: plat
        run: |
          if [ -d ios ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "La carpeta ios/ no existe todavía; falta el bootstrap."; fi
      - uses: subosito/flutter-action@v2
        if: steps.plat.outputs.exists == 'true'
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        if: steps.plat.outputs.exists == 'true'
      - run: flutter build ios --release --no-codesign 2>&1 | tee build-ios.log; exit ${PIPESTATUS[0]}
        if: steps.plat.outputs.exists == 'true'
      - name: Publicar registros
        if: always() && steps.plat.outputs.exists == 'true'
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/ci/publish_logs.sh ci-logs-clave-ios apps/clave/build-ios.log
